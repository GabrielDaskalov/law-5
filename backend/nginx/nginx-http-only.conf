# ============================================================
# ⚠️  САМО ЗА ЛОКАЛНА РАЗРАБОТКА — НЕ ГО ПОЛЗВАЙ НА ПУБЛИЧЕН СЪРВЪР!
#
# Този файл обслужва сайта на чист HTTP (порт 80) БЕЗ никакво
# пренасочване към HTTPS. Ако го качиш на сървър в интернет,
# JWT токенът, паролите и цялото съдържание пътуват в открит вид
# и всеки по пътя (Wi-Fi, доставчик, прокси) може да ги прочете.
#
# За production ползвай:
#   nginx/nginx.conf      — порт 80: само ACME + 301 към HTTPS
#   nginx/nginx-ssl.conf  — порт 443: сайтът + API-то
#
# Ползване локално:
#   docker run --rm -p 8080:80 \
#     -v $PWD/nginx/nginx-http-only.conf:/etc/nginx/conf.d/default.conf:ro \
#     -v $PWD/../site/dist:/usr/share/nginx/html:ro nginx:1.27-alpine
# ============================================================


# Gzip — КРИТИЧНО: сайтът е ~13 MB HTML (вградени данни);
# с gzip пътува ~2-3 MB. text/html се компресира по подразбиране при gzip on.
gzip on;
gzip_static on;  # сервира готовите .gz файлове (макс. компресия, без CPU)
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;
gzip_comp_level 6;

server {
    listen 80;
    server_name _;

    # Качване на прогреса (PUT /api/me/state) е до 2 MB —
    # default-ът на nginx е 1 MB и би блокирал синхронизацията!
    client_max_body_size 5m;

    # ---------- Let's Encrypt проверка ----------
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---------- Сайтът (един HTML файл + data.js по избор) ----------
    root /usr/share/nginx/html;
    index index.html;

    # Само админ качването на съдържание приема голям payload (PA_DATA ~12MB)
    location /api/admin/content {
        client_max_body_size 25m;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- API прокси ----------
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Stripe webhooks ----------
    location /webhooks/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # ---------- Health ----------
    location /health {
        proxy_pass http://api:3000/health;
    }

    # ---------- SPA fallback ----------
    location / {
        try_files $uri $uri/ /index.html;
    
        # Кеширане: браузърът пази сайта 1 час и след това пита „има ли промяна?“
        # (ETag) — при нова версия сваля наново, иначе ползва кеша. Логото и
        # данните се пазят по-дълго.
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        etag on;
    }

    # Данните (12MB) — кешират се 1 ден; при нова версия ETag ги обновява
    location = /pravo-academy-data.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    # Картинки и шрифтове — един месец кеш
    location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ---------- Сигурност ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
