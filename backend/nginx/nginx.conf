# ============================================================
# Law+ — nginx, порт 80 (безопасен по подразбиране)
#
# Този блок НЕ сервира сайта. Прави само две неща:
#   1. Пуска проверката на Let's Encrypt (/.well-known/acme-challenge/)
#   2. Пренасочва всичко останало към HTTPS (301)
#
# ЗАЩО: преди тук се сервираше целият сайт на чист HTTP и JWT токенът
# пътуваше в открит вид, ако операторът забрави да пусне
# scripts/init-letsencrypt.sh. Сега без HTTPS сайтът просто не тръгва —
# което е правилното поведение за production.
#
# Сайтът и API-то живеят в nginx-ssl.conf (порт 443).
# За локална разработка без сертификат: nginx-http-only.conf.
# ============================================================

# Gzip — КРИТИЧНО: сайтът е ~13 MB HTML (вградени данни);
# с gzip пътува ~2-3 MB. text/html се компресира по подразбиране при gzip on.
gzip on;
gzip_static on;  # сервира готовите .gz файлове (макс. компресия, без CPU)
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;
gzip_comp_level 6;

server {
    listen 80;
    server_name _;

    # Заглавките за сигурност — държим ги на едно място, за да не се
    # разминават между конфигурациите (виж security-headers.conf).
    include /etc/nginx/conf.d/security-headers.conf;

    # ---------- Let's Encrypt проверка ----------
    # ВАЖНО: тук НЕ слагай „location ~ /\.“ deny правило — то се проверява
    # преди префиксните location-и и би счупило подновяването на сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---------- Всичко останало → HTTPS ----------
    location / {
        return 301 https://$host$request_uri;
    }
}
