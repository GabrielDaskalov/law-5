# ============================================================
# Law+ — nginx с HTTPS (Let's Encrypt). ТОВА Е PRODUCTION КОНФИГУРАЦИЯТА.
#
# АКТИВИРАНЕ (след като init-letsencrypt.sh издаде сертификата):
#   1. В docker-compose.prod.yml смени nginx.conf → nginx-ssl.conf
#   2. Замени ДОМЕЙН с истинския домейн (3 места)
#   3. docker compose -f docker-compose.prod.yml restart web
#
# ВАЖНО: сервира се site/dist (билдът), а НЕ site/ (сорсът).
# Преди билда: cd site && npm ci && npm run build
# ============================================================

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;
gzip_comp_level 6;

# HTTP → HTTPS пренасочване (+ Let's Encrypt подновяване)
server {
    listen 80;
    server_name ДОМЕЙН;

    include /etc/nginx/conf.d/security-headers.conf;

    # ВАЖНО: тук НЕ слагай „location ~ /\.“ deny правило — regex location-ите
    # се проверяват ПРЕДИ префиксните и биха счупили подновяването на сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ДОМЕЙН;

    ssl_certificate     /etc/letsencrypt/live/ДОМЕЙН/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ДОМЕЙН/privkey.pem;

    # ---------- TLS: профил Mozilla Intermediate ----------
    # Само AEAD шифри с forward secrecy. `ssl_prefer_server_ciphers off`
    # оставя избора на клиента — модерните браузъри избират по-добре от нас
    # (напр. ChaCha20 на телефон без AES ускорение).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # Session tickets без ротация на ключа развалят forward secrecy — изключени.
    ssl_session_tickets off;
    # OCSP stapling: сървърът сам носи доказателството, че сертификатът е валиден
    # (по-бързо зареждане + браузърът не издава на CA кой отваря сайта).
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    client_max_body_size 5m;

    # Сервира се БИЛДЪТ (site/dist), не сорсът — виж docker-compose.prod.yml
    root /usr/share/nginx/html;
    index index.html;

    # Заглавките за сигурност (виж security-headers.conf).
    # Повтарят се и във всеки location с собствен add_header — иначе nginx
    # ги отменя точно там, където най-много трябват.
    include /etc/nginx/conf.d/security-headers.conf;

    # ---------- Предпазни правила: нищо от сорса навън ----------
    # Дори при грешно монтиране на ../site вместо ../site/dist тези правила
    # спират tests/03-admin.mjs (админска парола!), package.json, vite.config.js,
    # src/** и .env.example. Regex location-ите се проверяват преди префиксните,
    # затова важат и за грешно поискани пътища.
    # Проверено: нито един API маршрут не завършва на .json/.md/.mjs/.log,
    # така че правилата не засягат /api/ и /webhooks/.
    location ~ /\.                                { deny all; }
    location ~ ^/(tests|deploy|src|node_modules)/ { deny all; }
    location ~ \.(json|md|mjs|example|log)$       { deny all; }
    # vite.config.js / jest.config.ts и подобни: .js НЕ може да влезе в списъка
    # горе (сайтът е JavaScript), затова конфигурационните файлове се спират
    # поименно. Проверено с curl: без това правило /vite.config.js връща 200.
    location ~ ^/[^/]+\.config\.[cm]?[jt]s$      { deny all; }

    # Само админ качването на съдържание приема голям payload (PA_DATA ~12MB)
    location /api/admin/content {
        client_max_body_size 25m;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhooks/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location /health {
        proxy_pass http://api:3000/health;
    }

    # Данните (12MB) — кешират се 1 ден; при нова версия ETag ги обновява
    location = /pravo-academy-data.js {
        root /usr/share/nginx/html;
        include /etc/nginx/conf.d/security-headers.conf;   # иначе add_header долу ги отменя
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    # Хешираните файлове от Vite (main-a1b2c3d4.js) може да се кешират вечно
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;   # иначе add_header долу ги отменя
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---------- SPA fallback ----------
    location / {
        try_files $uri $uri/ /index.html;

        # Кеширане: браузърът пази страницата 1 час и след това пита
        # „има ли промяна?“ (ETag) — при нова версия сваля наново.
        include /etc/nginx/conf.d/security-headers.conf;   # иначе add_header долу ги отменя
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        etag on;
    }
}
