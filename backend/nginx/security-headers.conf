# ============================================================
# Law+ — заглавки за сигурност (едно място за всички конфигурации)
#
# ЗАЩО отделен файл: nginx има класически капан — ако в даден `location`
# блок има ПОНЕ ЕДИН `add_header`, той ОТМЕНЯ всички `add_header` от
# `server` нивото. Затова този файл се включва с `include` и на `server`
# ниво, И във всеки `location`, който има собствен `add_header`.
#
# Ползване:
#   include /etc/nginx/conf.d/security-headers.conf;
#
# Файлът се монтира от docker-compose.prod.yml в /etc/nginx/conf.d/.
# ============================================================

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# ------------------------------------------------------------
# Content-Security-Policy — ЗАСЕГА САМО В РЕЖИМ „ДОКЛАДВАЙ“
#
# ⚠️ ЗАЩО Report-Only, а не веднага в сила:
# Сайтът ползва inline `on*` атрибути (onclick="toggleTheme()" и подобни —
# 8 в site/index.html и ~135 в HTML-а, който модулите генерират, напр.
# site/src/parts/38-page.js). При `script-src 'self'` браузърът ги БЛОКИРА
# и половината бутони спират да работят. Затова политиката тръгва като
# Content-Security-Policy-Report-Only: браузърът само съобщава в конзолата
# какво БИ блокирал, без да чупи нищо.
#
# КАК СЕ ПРЕВКЛЮЧВА В СИЛА (след като inline handler-ите се мигрират
# към addEventListener — виж коментара най-долу в site/src/main.js):
#   1. Мигрирай inline `on*` атрибутите към addEventListener.
#   2. Отвори сайта, виж дали в конзолата има още CSP съобщения.
#   3. Смени долу `Content-Security-Policy-Report-Only` на
#      `Content-Security-Policy` и презареди nginx:
#      docker compose -f docker-compose.prod.yml exec web nginx -s reload
#
# Проверено в site/index.html и site/styles/app.css:
#   • style-src 'unsafe-inline'  — НУЖНО е: има style="" атрибути
#     (логото, мобилното меню). Няма <style> блокове и няма @import в CSS.
#   • https://fonts.googleapis.com (style-src) и https://fonts.gstatic.com
#     (font-src) — НУЖНИ са: index.html тегли Playfair Display + Inter.
#   • img-src data: — НУЖНО е: логото и favicon-ът са base64 в HTML-а.
#   • frame-src за YouTube/Vimeo — НУЖНО е: видео уроците се вграждат в
#     <iframe> (site/src/parts/16-feature.js + 38-page.js). Без него
#     `default-src 'self'` спира вградените видеа.
# ------------------------------------------------------------
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-src https://www.youtube.com https://player.vimeo.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
