# ============================================================
# Law+ — пълен production stack
# Стартиране: docker compose -f docker-compose.prod.yml up -d
#
# Структурата на пакета трябва да е запазена:
#   pravo-academy/
#   ├── backend/    ← този файл е тук
#   └── site/       ← сорсът на сайта
#       └── dist/   ← БИЛДЪТ, който nginx сервира (npm ci && npm run build)
#
# ПРЕДИ стартиране: cd ../site && npm ci && npm run build
# ============================================================

services:
  # ---------- PostgreSQL база данни ----------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pravo_academy}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD е задължителен}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Схема + ВСИЧКИ миграции при първо стартиране (по ред)
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./src/db/migrations/003_create_stripe_tables.sql:/docker-entrypoint-initdb.d/02_stripe.sql:ro
      - ./src/db/migrations/004_add_user_role.sql:/docker-entrypoint-initdb.d/03_roles.sql:ro
      - ./src/db/migrations/005_create_purchases.sql:/docker-entrypoint-initdb.d/04_purchases.sql:ro
      - ./src/db/migrations/006_site_features.sql:/docker-entrypoint-initdb.d/05_site.sql:ro
      - ./src/db/migrations/007_reminders_ai.sql:/docker-entrypoint-initdb.d/06_reminders.sql:ro
      - ./src/db/migrations/009_client_errors.sql:/docker-entrypoint-initdb.d/07_errors.sql:ro
      # Липсваха: 008 (изоставени поръчки) и 010 (моделът на съдържанието).
      # Без 010 пресен сървър няма таблиците за платеното съдържание изобщо
      # и /api/content/* връща 500 от първата минута.
      - ./src/db/migrations/008_abandoned_checkout.sql:/docker-entrypoint-initdb.d/08_abandoned.sql:ro
      - ../migrations/010_content_model.sql:/docker-entrypoint-initdb.d/09_content.sql:ro
      - ./src/db/migrations/011_lipsvashti_tablici.sql:/docker-entrypoint-initdb.d/10_lipsvashti.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-pravo_academy}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Redis кеш ----------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------- Backend API ----------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-pravo_academy}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET е задължителен}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY е задължителен}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET е задължителен}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@pravo-academy.bg}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AI_MODEL: ${AI_MODEL:-claude-3-5-haiku-latest}
      AI_STUB: ${AI_STUB:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------- Nginx: сервира САЙТА + проксира API ----------
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # За HTTPS: смени nginx.conf → nginx-ssl.conf (виж DEPLOY.md)
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Заглавките за сигурност — включват се с `include` от двете конфигурации
      - ./nginx/security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
      # ВАЖНО: сервира се БИЛДЪТ (site/dist), а НЕ сорсът (site/).
      # Преди `up -d`: cd site && npm ci && npm run build
      # Ако тук стои ../site, публично достъпни стават tests/03-admin.mjs
      # (админска парола!), package.json, vite.config.js, src/** и .env.example.
      - ../site/dist:/usr/share/nginx/html:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro

  # ---------- Let's Encrypt автоматично подновяване ----------
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    # Проверява за подновяване на всеки 12 часа
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
  certbot_www:
  certbot_conf:
